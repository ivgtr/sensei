name: Rust MVP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: CLI smoke
        run: cargo run --release -- --help
      - name: Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sensei-windows-x64
          path: target/release/sensei.exe
          if-no-files-found: error
      - name: Managed Companion installation and unpaired MCP handshake
        if: runner.os == 'Windows'
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sensei-companion"
          .\target\release\sensei.exe --root $root setup --paint csp --companion --no-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\sensei.exe --root $root doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
