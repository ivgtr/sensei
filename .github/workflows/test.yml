name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
  csp-install-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sensei and pinned CSP backend
        run: python scripts/bootstrap.py --root "${{ runner.temp }}/sensei-smoke" install --paint csp
      - name: Test cross-version MCP handshake without CSP or pairing
        run: .\.venv\Scripts\sensei-setup.exe --root "${{ runner.temp }}/sensei-smoke" doctor
