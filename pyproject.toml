[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensei-mcp"
version = "0.1.0"
description = "Action-first paint assistant MCP facade"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.27,<1", "jsonschema>=4.23,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sensei-mcp = "sensei_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
